name: Standalone Display Adjuster
on:
  push:
    branches: [tools/display-adjuster]
    paths: ['adjuster/**', '.github/workflows/adjuster.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S adjuster -B build-adjuster -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build-adjuster --config Release --parallel
      - name: Test
        run: ctest --test-dir build-adjuster -C Release --output-on-failure
      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build-adjuster/Release/LCDInfoDisplayAdjuster.exe dist/
          $hash = (Get-FileHash dist/LCDInfoDisplayAdjuster.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LCDInfoDisplayAdjuster.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LCDInfoDisplayAdjuster-${{ matrix.arch }}
          path: dist/
